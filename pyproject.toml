[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "OPENSC2"
version = "2.0.0"
authors = [{name = "MAHTEP Group (PoliTo), SRS Group (IPP)"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
# Scientific computing
"numpy>=1.26",
"scipy>=1.12",
"pandas>=2.2",
# Compiled kernels (banded system-matrix assembly); a numpy fallback is used
# when numba is missing
"numba>=0.60",

# Plotting
"matplotlib>=3.8",
"Pillow>=10.0",

# Thermodynamics / engineering
"CoolProp>=6.6",

# Excel / YAML input support
"openpyxl>=3.1",
"PyYAML>=6.0",

# Typing backport (Self, used ahead of the stdlib py3.11 typing.Self)
"typing_extensions>=4.9",

# Interactive shell support
"ipython>=8.20",

]

[project.optional-dependencies]
# The GUI (opensc2/drivers/gui/opensc2_gui.py) uses tkinter, which ships with the Python
# standard library (may require an OS-level Tk package, e.g. python3-tk).
dev = [
# Testing
"pytest>=8.0",

# Formatting / linting
"black>=24.0",
"ruff>=0.5",

# Type checking
"mypy>=1.10",

# Layered-architecture contracts (lint-imports); mirrors tests/test_architecture.py
"import-linter>=2.0",

# Profiling
"line-profiler>=4.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: runs a full Simulation (minutes); deselect with -m 'not slow'",
    "regression: compares a TDD example against committed reference data",
    "verification: analytical verification suite (tests/verification)",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "T20"]

# T20 (no print) applies to the domain and application layers; adapters,
# drivers and tests may print. The per-file list below is the baseline of
# domain modules that still print (docs/architecture_refactoring_plan.md,
# Stage 5 replaces them with observers); it may only shrink.
[tool.ruff.lint.per-file-ignores]
"opensc2/adapters/**" = ["T20"]
"opensc2/drivers/**" = ["T20"]
"opensc2/simulation.py" = ["T20"]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
"models/**" = ["T20"]
"tools/**" = ["T20"]
"opensc2/components/fluid/fluid_component.py" = ["T20"]
"opensc2/components/solid/solid_component.py" = ["T20"]
"opensc2/conductor/conductor_topology.py" = ["T20"]
"opensc2/numerics/initial_flow.py" = ["T20"]
"opensc2/thermal/energy_balance.py" = ["T20"]
"opensc2/thermal/temperature_field.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[project.scripts]
opensc2 = "opensc2.drivers.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["opensc2*"]

[tool.setuptools.package-data]
opensc2 = ["*.conf", "drivers/gui/gui_icons/*", "input_files/input_file_template/*"]

# ---------------------------------------------------------------------------
# Layered architecture (docs/architecture.md). Run with `lint-imports` from
# the repository root. The pytest ratchet in tests/test_architecture.py
# enforces the same direction (all its baselines are empty).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["opensc2"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: drivers -> adapters -> application -> domain"
type = "layers"
layers = [
    "opensc2.simulation | opensc2.simulation_starter | opensc2.drivers",
    "opensc2.adapters",
    "opensc2.application",
    "opensc2.numerics | opensc2.runtime | opensc2.ports | opensc2.conductor | opensc2.components | opensc2.thermal | opensc2.electromagnetics | opensc2.hydraulics | opensc2.environment | opensc2.properties_of_materials | opensc2.physical_fields | opensc2.cylindrical_helix",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not use I/O or plotting libraries"
type = "forbidden"
source_modules = [
    "opensc2.physical_fields", "opensc2.properties_of_materials", "opensc2.hydraulics",
    "opensc2.thermal", "opensc2.electromagnetics", "opensc2.components", "opensc2.conductor",
    "opensc2.environment", "opensc2.numerics", "opensc2.runtime", "opensc2.ports",
    "opensc2.application",
]
forbidden_modules = [
    "pandas", "openpyxl", "yaml", "CoolProp", "matplotlib", "PIL", "tkinter", "IPython",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on the GUI toolkit"
type = "forbidden"
source_modules = ["opensc2.adapters"]
forbidden_modules = ["tkinter"]
