[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "OPENSC2"
version = "2.0.0"
authors = [{name = "MAHTEP Group (PoliTo), SRS Group (IPP)"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
# Scientific computing
"numpy>=1.26",
"scipy>=1.12",
"pandas>=2.2",

# Plotting
"matplotlib>=3.8",
"Pillow>=10.0",

# Thermodynamics / engineering
"CoolProp>=6.6",

# Excel / YAML input support
"openpyxl>=3.1",
"PyYAML>=6.0",

# Typing backport (Self, used ahead of the stdlib py3.11 typing.Self)
"typing_extensions>=4.9",

# Interactive shell support
"ipython>=8.20",

]

[project.optional-dependencies]
# The GUI (opensc2_gui.py) uses tkinter, which ships with the Python
# standard library (may require an OS-level Tk package, e.g. python3-tk).
dev = [
# Testing
"pytest>=8.0",

# Formatting / linting
"black>=24.0",
"ruff>=0.5",

# Type checking
"mypy>=1.10",

# Profiling
"line-profiler>=4.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "source_code"}

[tool.setuptools.packages.find]
where = ["source_code"]