    initial_pressure: 533190.0
    initial_temperature: 6.176
    volume: 0.0018
    
  - identifier: return_line
    kind: reservoir
    pressure: 533190.0
    temperature: 6.176
    
  branches:
  - identifier: supply_to_filter
    kind: valve
    from: supply
    to: filter
    linear_resistance: 0.0
    quadratic_resistance: 100000000.0
    inertance: 0.0
    initial_mass_flow: 0.0037
    
  - identifier: filter_to_pair3
    kind: pipe
    from: filter
    to: pair3_header
    length: 0.145
    hydraulic_diameter: 0.021
    cross_section: 0.000346
    friction_factor_model: 110
    initial_mass_flow: 0.0037
    
  - identifier: pair3_to_pair2
    kind: pipe 
    from: pair3_header
    to: pair2_header
    length: 0.261
    hydraulic_diameter: 0.021
    cross_section: 0.000346
    friction_factor_model: 110
    initial_mass_flow: 0.0024
    
  - identifier: pair2_to_pair1
