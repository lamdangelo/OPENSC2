    from: outlet1_header
    to: return_manifold
    linear_resistance: 1.0
    quadratic_resistance: 0.0
    inertance: 0.0
    initial_mass_flow: 0.0006
    
  - identifier: to_return_line
    kind: valve 
    from: return_manifold
    to: return_line 
    linear_resistance: 0.0
    quadratic_resistance: 100000000.0
    inertance: 0.0
    initial_mass_flow: 0.0006
  
