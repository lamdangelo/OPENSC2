format: opensc2-yaml/1
simulation:
  name: W7X_QT
  end_time: 10000.0
  time_stepping:
    adaptivity: ERROR_CONTROLLED
    minimum_step: 0.001
    maximum_step: 1.0
    tolerance: 0.001
    reference_time: 0
    reference_duration: 10
environment:
  medium: Air
  temperature: 300.15
  pressure: 101325
conductors:
- file: conductor_CONDUCTOR_100.yaml
- file: conductor_CONDUCTOR_200.yaml
- file: conductor_CONDUCTOR_300.yaml
- file: conductor_CONDUCTOR_400.yaml
- file: conductor_CONDUCTOR_500.yaml
- file: conductor_CONDUCTOR_600.yaml
hydraulic_network:
  fluid_type: helium
  nodes:
  - identifier: supply
    kind: reservoir
    pressure: 595030.0
    temperature: 6.176
    
  - identifier: filter
    kind: internal
    initial_pressure: 595030.0
    initial_temperature: 6.176
    volume: 0.0018
    
  - identifier: pair3_header
    kind: internal
    initial_pressure: 595030.0
    initial_temperature: 6.176
    volume: 0.0000
   
  - identifier: pair2_header
    kind: internal
    initial_pressure: 595030.0
    initial_temperature: 6.176
    volume: 0.0000
    
  - identifier: pair1_header
